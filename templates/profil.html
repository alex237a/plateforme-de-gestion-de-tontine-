{% extends "base.html" %}
{% block titre %}Mon profil · Njangi+{% endblock %}
{% block contenu %}
<section class="wrap">
  <h1>Mon profil</h1>
  <div class="deux-colonnes">
    <form id="form-profil" class="carte formulaire" method="post" action="{{ url_for('modifier_profil') }}" novalidate>
      <h2 class="petit-titre">Mes informations</h2>
      <input type="hidden" name="csrf" value="{{ jeton_csrf() }}">
      <div class="champ"><label for="nom">Nom complet</label>
        <input id="nom" name="nom" type="text" maxlength="80" value="{{ valeurs.nom }}" required>
        <p class="erreur-champ" id="err-nom" role="alert"></p></div>
      <div class="champ"><label for="telephone">Téléphone</label>
        <input id="telephone" name="telephone" type="tel" inputmode="numeric" value="{{ valeurs.telephone }}" required>
        <p class="erreur-champ" id="err-telephone" role="alert"></p></div>
      <button class="btn" type="submit">Enregistrer</button>
    </form>
    <form id="form-code" class="carte formulaire" method="post" action="{{ url_for('modifier_code') }}" novalidate>
      <h2 class="petit-titre">Changer mon code d'accès</h2>
      <input type="hidden" name="csrf" value="{{ jeton_csrf() }}">
      <div class="champ"><label for="ancien">Code actuel</label>
        <input id="ancien" name="ancien" type="password" autocomplete="current-password" required></div>
      <div class="champ"><label for="nouveau">Nouveau code (6 caractères minimum)</label>
        <input id="nouveau" name="nouveau" type="password" autocomplete="new-password" required>
        <p class="erreur-champ" id="err-nouveau" role="alert"></p></div>
      <div class="champ"><label for="confirmation">Confirmez le nouveau code</label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required>
        <p class="erreur-champ" id="err-confirmation" role="alert"></p></div>
      <button class="btn ghost" type="submit">Changer le code</button>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/formulaires.js') }}" defer></script>{% endblock %}
